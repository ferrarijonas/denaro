name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepara site com o conteudo de mock/
        run: |
          mkdir -p _site
          cp -R mock/. _site/
      - name: Poka-yoke — bloqueia dados sensiveis
        run: |
          set -e
          forbidden='\.(xlsx|xls|csv|ods|numbers|db|sqlite|sqlite3|db3|dump|dmp|pem|key|p12|pfx|p8)$|(^|/)(data|backup)/|(^|/)\.env(\..*)?$|(^|/)id_(rsa|ed25519)$'
          if git ls-files | grep -E "$forbidden"; then
            echo "::error::POKA-YOKE: arquivos sensiveis versionados no repositorio. Deploy abortado."
            exit 1
          fi
          if find _site -type f | grep -E "$forbidden"; then
            echo "::error::POKA-YOKE: arquivos sensiveis no artefato publicavel. Deploy abortado."
            exit 1
          fi
          echo "Poka-yoke OK: nenhum arquivo proibido."
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
